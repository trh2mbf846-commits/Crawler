# Render.com Blueprint (https://render.com/docs/blueprint-spec) für ein Ein-Container-Deployment
# des Ausschreibungs-Crawlers.
#
# WICHTIG: Render erwartet render.yaml am Repository-Root. Dieses Repository enthält im Root
# aber zusätzlich ein unabhängiges Brettspiel-Projekt (siehe README) - der Ausschreibungscrawler
# lebt bewusst im Unterordner `ausschreibungscrawler/`. Vor dem Verbinden mit Render daher
# entweder (a) diese Datei nach `<repo-root>/render.yaml` kopieren (die Pfade unten sind bereits
# repo-root-relativ, also unverändert lauffähig), oder (b) einfacher: in Render "New -> Web
# Service" (nicht Blueprint) wählen, dieses Repository verbinden und "Root Directory" auf
# `ausschreibungscrawler` setzen - dann reicht das Dockerfile allein, render.yaml wird nicht
# gebraucht.
#
# Bewusst kein Dauerbetrieb (Nutzeranfrage 01.09.2026): CRAWLER_SCHEDULER_ENABLED=false im
# Dockerfile deaktiviert den periodischen Scheduler fest; Aktualisierung passiert ausschließlich
# über den "Aktualisieren"-Button im Frontend (POST /api/run-all).
#
# Persistenz: ohne bezahlten Disk-Zusatz (Render Free/Starter ohne Persistent Disk) verliert die
# SQLite-Datenbank ihren Inhalt bei jedem Neustart/Redeploy - beim nächsten Klick auf
# "Aktualisieren" ist die Ausschreibungsliste aber sofort wieder gefüllt, das passt zum
# Nutzungsmuster "gelegentlich manuell aktualisieren" ohne Langzeit-Historie. Für dauerhafte
# Persistenz: Persistent Disk unter /app/data hinzufügen (siehe Render-Doku) oder auf die in
# docs/schema_postgresql.sql vorbereitete PostgreSQL-Variante wechseln (CRAWLER_DATABASE_URL
# entsprechend setzen).
services:
  - type: web
    name: ausschreibungscrawler
    runtime: docker
    dockerfilePath: ./ausschreibungscrawler/Dockerfile
    dockerContext: ./ausschreibungscrawler
    plan: starter
    envVars:
      - key: CRAWLER_SCHEDULER_ENABLED
        value: "false"
      - key: CRAWLER_HTTP_REQUEST_DELAY_SECONDS
        value: "1.5"
      # Optional: LLM-Nachbewertung von Grenzfällen (Kapitel 4.3) - ohne diesen Key läuft die
      # Keyword-/CPV-Klassifikation unverändert weiter, dieser Schritt wird nur übersprungen.
      - key: CRAWLER_ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /api/health
